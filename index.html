<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <title>Teslo shopping</title>
  </head>
  <body>
    <!-- top bar -->
    <div id="top-bar" class="bg-gray-300 fixed left-0 right-0 py-2 top-0">
      <p class="text-center py-2 font-semibol">0% APR for qualifier buyers</p>
    </div>
    <!-- Header -->
    <header class="flex justify-between items-center px-10 py-6 mt-16">
      <img src="./images/logo.svg" alt="teslo logo" width="120" height="24" />
      <button>
        <i class="fa-solid fa-globe"></i><span class="font-bold">US</span>
      </button>
    </header>
    <!-- main -->
    <main class="flex flex-col md:flex-row justify-between px-4 md:px-10 py-6">
      <!-- images -->
      <section class="w-full md:w-3/4">
        <div class="sticky top-24">
          <div
            class="bg-gray-200 flex h-96 items-center justify-center overflow-hidden"
          >
            <img
              class="max-w-full h-auto transform scale-125"
              src="./images/model-y-stealth-grey.jpg"
              alt="Model-y"
              id="exterior-image"
            />
          </div>
        </div>
      </section>
      <!-- sidebar -->

      <aside class="w-full md:w-1/3 pl-0 md:pl-8 mt-6 md:mt-0 z-2">
        sidebar
      </aside>
    </main>
    <script src="./JS/main.js"></script>
  </body>
</html>
